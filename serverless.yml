service: up-bank-ynab-transformer
frameworkVersion: "3"

useDotenv: true

provider:
  name: aws
  runtime: nodejs16.x
  stage: prod
  region: ap-southeast-2
  logRetentionInDays: 90
  apiGateway:
    shouldStartNameWithService: true

plugins:
  - serverless-dotenv-plugin
  - serverless-plugin-typescript

functions:
  upWebhookHandler:
    handler: src/index.upWebhook
    events:
      - http:
          path: webhook/up
          method: post
