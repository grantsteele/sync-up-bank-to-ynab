service: up-bank-ynab-transformer
frameworkVersion: "3"

useDotenv: true

provider:
  name: aws
  runtime: nodejs16.x
  stage: prod
  region: ap-southeast-2
  logRetentionInDays: 90
  apiGateway:
    shouldStartNameWithService: true

plugins:
  - serverless-dotenv-plugin
  - serverless-esbuild

custom:
  esbuild:
    # Bundle the code and its libraries into a single file, so packaging doesn't
    # depend on Serverless working out which node_modules to include (which
    # breaks with newer npm versions and ships a function missing its libraries).
    bundle: true
    minify: false
    sourcemap: true
    target: node16

functions:
  upWebhookHandler:
    handler: src/index.upWebhook
    events:
      - http:
          path: webhook/up
          method: post
